services:
 redpanda:
   image: docker.redpanda.com/redpandadata/redpanda:latest
   container_name: redpanda
   command:
     - redpanda
     - start
     - --smp 1
     - --memory 1G
     - --overprovisioned
     - --node-id 0
     - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
     - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
   ports:
     - "19092:19092"
     - "9644:9644"
   healthcheck:
     test: ["CMD", "rpk", "cluster", "health"]
     interval: 15s
     timeout: 5s
     retries: 5
 
 console:
   image: docker.redpanda.com/redpandadata/console:latest
   container_name: redpanda-console
   depends_on: [redpanda]
   ports:
     - "8085:8080"
   environment:
     KAFKA_BROKERS: redpanda:9092
 
 clickhouse:
   image: clickhouse/clickhouse-server:latest
   container_name: clickhouse
   depends_on: [redpanda]
   ports:
     - "8123:8123"
     - "9000:9000"
   environment:
     CLICKHOUSE_USER: ${CLICKHOUSE_USER}
     CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
     CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
   ulimits:
     nofile: { soft: 262144, hard: 262144 }
   # Ceiling above the server's own 3.26 GiB cap, so ClickHouse hits its own
   # limit and returns an error instead of being OOM-killed by the kernel.
   mem_limit: 4g
   volumes:
     - clickhouse_data:/var/lib/clickhouse
     # Mount the FILE, not the directory. Mounting the directory shadows the
     # image's own docker_related_config.xml, which is what supplies
     # <listen_host>::</listen_host> - without it ClickHouse binds loopback only
     # and every other container gets "connection refused" on 8123.
     - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
     # ClickHouse logs to files, not stdout, so `docker compose logs clickhouse`
     # shows only boot lines. Unmounted they live in the container layer and
     # `down` destroys them - which is exactly what happened on 2026-09-14.
     - clickhouse_logs:/var/log/clickhouse-server

 producer:
   build: ./producer
   container_name: producer
   depends_on: [redpanda]
   restart: unless-stopped
   environment:
     KAFKA_BROKER: redpanda:9092

 api:
   build: ./api
   container_name: api
   depends_on: [clickhouse]
   restart: unless-stopped
   ports:
     - "8000:8000"
   environment:
     CLICKHOUSE_HOST: clickhouse
     CLICKHOUSE_PORT: 8123
     CLICKHOUSE_USER: ${CLICKHOUSE_USER}
     CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
     CLICKHOUSE_DATABASE: default

volumes:
 clickhouse_data:
 clickhouse_logs: